<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in — Pour Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=10" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <a class="wordmark" href="/">Pour Intelligence</a>
          <span class="product-sub">Admin sign-in</span>
        </div>
      </div>
    </header>
    <div class="page">
      <section class="login-panel">
        <p class="empty-kicker">Internal</p>
        <h2>Sign in</h2>
        <form id="login-form">
          <label>
            Username
            <input id="username" name="username" value="admin" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" id="login-btn" class="btn-primary">Enter</button>
          <p id="login-error" class="form-error" hidden></p>
        </form>
      </section>
    </div>
    <script>
      const form = document.querySelector("#login-form");
      const errorEl = document.querySelector("#login-error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        const response = await fetch("/admin/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value,
          }),
        });
        const payload = await response.json();
        if (!response.ok) {
          errorEl.hidden = false;
          errorEl.textContent = payload.detail || "Could not sign in.";
          return;
        }
        window.location.href = "/admin";
      });
    </script>
  </body>
</html>
