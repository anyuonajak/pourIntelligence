<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Monolith</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=29" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <a class="wordmark" href="/">Monolith</a>
          <span class="product-sub">Admin</span>
        </div>
        <div class="topbar-actions">
          <nav class="admin-tabs" role="tablist">
            <button type="button" class="active" data-tab="checks">Checks</button>
            <button type="button" data-tab="orgs">Orgs</button>
            <button type="button" data-tab="keys">API keys</button>
          </nav>
          <button type="button" id="logout-btn" class="text-btn">Sign out</button>
        </div>
      </div>
    </header>

    <div class="page">
      <section id="tab-checks">
        <div class="admin-toolbar">
          <div class="product-switch" id="product-filter" role="group" aria-label="Product">
            <button type="button" class="active" data-filter="concrete">Concrete</button>
            <button type="button" data-filter="masonry">Masonry</button>
          </div>
          <div class="filter-tabs" id="watch-filter" role="group" aria-label="Watch status">
            <button type="button" class="active" data-watch="watching">Watching</button>
            <button type="button" data-watch="closed">Closed</button>
            <button type="button" data-watch="all">All</button>
          </div>
        </div>
        <p class="workspace-note" id="workspace-note">Concrete slab</p>
        <dl class="metrics" id="summary"></dl>
        <div class="admin-workspace">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Site</th>
                  <th>Watch</th>
                  <th>Status</th>
                  <th>Outcome</th>
                  <th>Source</th>
                </tr>
              </thead>
              <tbody id="checks-body">
                <tr>
                  <td colspan="6">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
          <aside class="check-detail" id="check-detail" aria-live="polite">
            <p class="empty-kicker">Select a check</p>
          </aside>
        </div>
      </section>

      <section id="tab-orgs" hidden>
        <form id="org-form" class="panel key-form">
          <label>
            Company
            <input id="org-name" name="company_name" placeholder="Company name" required maxlength="80" />
          </label>
          <label>
            Email
            <input id="org-email" name="email" type="email" autocomplete="off" required maxlength="254" />
          </label>
          <label>
            Password
            <input id="org-password" name="password" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <button type="submit">Onboard org</button>
        </form>
        <p id="new-org" class="new-key" hidden></p>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Company</th>
                <th>Email</th>
                <th>Onboarded</th>
                <th>Trial ends</th>
              </tr>
            </thead>
            <tbody id="orgs-body">
              <tr>
                <td colspan="4">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="tab-keys" hidden>
        <form id="key-form" class="panel key-form">
          <label>
            Key name
            <input id="key-name" name="name" placeholder="QuoteIQ sandbox" required />
          </label>
          <label>
            Rate limit / hour
            <input id="key-limit" name="rate_limit_per_hour" type="number" min="1" max="10000" value="300" />
          </label>
          <button type="submit">Mint key</button>
        </form>
        <p id="new-key" class="new-key" hidden></p>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Prefix</th>
                <th>Limit</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="keys-body">
              <tr>
                <td colspan="5">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="/admin.js?v=14"></script>
  </body>
</html>
