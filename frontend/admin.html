<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Pour Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=4" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="brand">
          <p class="eyebrow">Internal</p>
          <h1>Admin</h1>
          <p class="tagline">Pick a product and a watch state. Inspect the stored calculation.</p>
        </div>
        <button type="button" id="logout-btn" class="text-btn">Sign out</button>
      </header>

      <nav class="admin-tabs" role="tablist">
        <button type="button" class="active" data-tab="checks">Checks vs outcomes</button>
        <button type="button" data-tab="keys">API keys</button>
      </nav>

      <section id="tab-checks">
        <div class="product-switch" id="product-filter" role="group" aria-label="Product">
          <button type="button" class="active" data-filter="concrete">Concrete slab</button>
          <button type="button" data-filter="masonry">Masonry</button>
        </div>
        <div class="presets" id="watch-filter" role="group" aria-label="Watch status">
          <button type="button" class="active" data-watch="watching">Watching</button>
          <button type="button" data-watch="closed">Closed</button>
          <button type="button" data-watch="all">All</button>
        </div>
        <p class="workspace-note" id="workspace-note">Concrete slab · ACI 305R / 306R</p>
        <dl class="metrics" id="summary"></dl>
        <div class="admin-workspace">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Site</th>
                  <th>Watch</th>
                  <th>Status</th>
                  <th>Outcome</th>
                  <th>Source</th>
                </tr>
              </thead>
              <tbody id="checks-body">
                <tr>
                  <td colspan="6">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
          <aside class="check-detail" id="check-detail" aria-live="polite">
            <p class="empty-kicker">Select a check</p>
            <p>Choose a row to see mix, risks, metrics, and predictions for that product.</p>
          </aside>
        </div>
      </section>

      <section id="tab-keys" hidden>
        <form id="key-form" class="ticket key-form">
          <label>
            Key name
            <input id="key-name" name="name" placeholder="QuoteIQ sandbox" required />
          </label>
          <label>
            Rate limit / hour
            <input id="key-limit" name="rate_limit_per_hour" type="number" min="1" max="10000" value="300" />
          </label>
          <button type="submit">Mint key</button>
        </form>
        <p id="new-key" class="new-key" hidden></p>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Prefix</th>
                <th>Limit</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="keys-body">
              <tr>
                <td colspan="5">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="/admin.js?v=5"></script>
  </body>
</html>
