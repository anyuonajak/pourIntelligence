<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Monolith</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=28" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <a class="wordmark" href="/">Monolith</a>
        </div>
      </div>
    </header>
    <div class="page">
      <section class="login-panel">
        <h2>Sign in</h2>
        <form id="auth-form">
          <label>
            Email
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" id="signin-btn" class="btn-primary">Sign in</button>
          <p id="auth-error" class="form-error" hidden></p>
        </form>
        <p class="ticket-foot"><a href="/signup">Get started</a></p>
      </section>
    </div>
    <script>
      fetch("/v1/auth/me", { credentials: "include" }).then((response) => {
        if (response.ok) window.location.replace("/app");
      });
      const form = document.querySelector("#auth-form");
      const errorEl = document.querySelector("#auth-error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        const response = await fetch("/v1/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.querySelector("#email").value,
            password: document.querySelector("#password").value,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          errorEl.hidden = false;
          errorEl.textContent = typeof payload.detail === "string" ? payload.detail : "Could not sign in.";
          return;
        }
        window.location.href = "/app";
      });
    </script>
  </body>
</html>
